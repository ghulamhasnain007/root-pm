server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # Agent-bridge config/memory dashboard API
    location /api {
        proxy_pass http://config-api:8000;
        proxy_set_header Host $host;
    }

    # Voice bot REST (integrations, scheduling, ambient, Discord meetings)
    location /integrations {
        proxy_pass http://voice-bot:3001;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://voice-bot:3001;
    }

    # Voice bot WebSocket (live transcript / audio signaling)
    location /ws {
        proxy_pass http://voice-bot:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # auth-service (org registration, login, staff, tool config). No
    # /api prefix (that's already config-api's namespace above) — proxied
    # directly by auth-service's own route paths, which don't collide with
    # voice-bot's /integrations/* or config-api's /api/* namespaces.
    location /auth {
        proxy_pass http://auth-service:4000;
        proxy_set_header Host $host;
    }
    location /orgs {
        proxy_pass http://auth-service:4000;
        proxy_set_header Host $host;
    }
    location /.well-known {
        proxy_pass http://auth-service:4000;
        proxy_set_header Host $host;
    }
}
