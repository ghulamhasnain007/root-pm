# ── Full Event-Driven Stack ───────────────────────────────────────────────────
# Services: Kafka (KRaft) · Kafka UI · voice bot · agent-bridge bot ·
#           agent-bridge config API · client (unified dashboard, port 5173) ·
#           auth-service (org/staff/sessions, port 4000, standalone for now)
#
# Usage:
#   docker compose up -d                   start everything
#   docker compose logs -f voice-bot       voice bot logs
#   docker compose logs -f agent-bot       text bot logs
#   docker compose logs -f client          unified frontend logs
#   docker compose logs -f auth-service    auth service logs
#   docker compose down                    stop everything

services:

  # ── Kafka (KRaft — no Zookeeper) ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: project-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - project-net

  # ── Kafka topic initialiser ───────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: project-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic agent-bridge.task-events --partitions 4 --replication-factor 1 \
        --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic agent-bridge.meeting-events --partitions 4 --replication-factor 1 \
        --config retention.ms=604800000
      echo Topics ready.
      "
    networks:
      - project-net

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: project-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: project
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - project-net

  # ── Voice bot backend (scrum-master-ai) ───────────────────────────────────
  voice-bot:
    build:
      context: ../scrum-master-ai/backend
      dockerfile: Dockerfile
    container_name: voice-bot
    restart: unless-stopped
    env_file: ../.env
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: scrum-master-ai
      PORT: 3001
      HOST: 0.0.0.0
      # MongoDB — required for scheduling/ambient-assistant/credential
      # storage; wasn't set here before (those features had no backing
      # store configured in this compose file at all).
      MONGODB_URI: mongodb://mongo:27017/scrum-master-ai
      # Multi-org auth (see src/auth/requireAuth.ts). Set to enforce real
      # per-org authentication instead of the single-org "default"
      # fallback. AUTH_SERVICE_INTERNAL_KEY must match auth-service's own
      # INTERNAL_SERVICE_KEY exactly — both come from the root .env
      # (env_file above), not hardcoded here.
      AUTH_SERVICE_URL: http://auth-service:4000
      AMBIENT_BOOTSTRAP_ORG_ID: ${AMBIENT_BOOTSTRAP_ORG_ID:-default}
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - project-net

  # ── Voice bot frontend ────────────────────────────────────────────────────
  # (removed — merged into the single `client` service below, see its comment)

  # ── Redis (short-term memory) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: project-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project-net

  # ── MongoDB (long-term memory) ────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: project-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project-net

  # ── Auth service (org registration, staff, sessions) ─────────────────────
  # Phase 1 of the multi-tenancy plan (see project docs) — standalone,
  # not yet consumed by agent-bot/voice-bot (that's later phases). Uses a
  # separate Redis DB index (2) from agent-bridge's memory store (0), on
  # the same Redis instance — refresh-token session data and conversation
  # memory are unrelated and shouldn't share a keyspace.
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      STORAGE: mongo
      MONGO_URI: mongodb://mongo:27017/auth-service
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379/2
      CLIENT_BASE_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      INTERNAL_SERVICE_KEY: rmlBm5sdXh4QQX6vyW7RMLxX/BsW48zqWC+Ca1jhCsQ=
      TOOL_CREDENTIAL_ENCRYPTION_KEY: 9vFm+qUooEIcD2hf59EAuzX9K5XncSvTlXT735ikcr8=
      EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Root-PM <no-reply@root-pm.local>}
      SEED_DEFAULT_ORG: "true"
      SEED_ADMIN_EMAIL: ghasnain668@gmail.com
      SEED_ADMIN_PASSWORD: Wahaj@1234
      SEED_ADMIN_NAME: Admin
      SEED_ORG_NAME: Default Organization
      SEED_TAIGA_URL: http://api.taiga.io/api/v1
      SEED_TAIGA_USER: ghasnain668@gmail.com
      SEED_TAIGA_PASS: Wahaj@1234
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project-net

  # ── Agent Bridge text bot ─────────────────────────────────────────────────
  agent-bot:
    build:
      context: ../agent-bridge
      dockerfile: backend/server/Dockerfile.bot
    container_name: agent-bot
    restart: unless-stopped
    env_file: ../.env
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_BRIDGE_ROOT: /app/backend/python-consumer
    volumes:
      - ../agent-bridge/backend/data:/app/backend/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - project-net

  # ── Agent Bridge config API ───────────────────────────────────────────────
  config-api:
    build:
      context: ../agent-bridge
      dockerfile: backend/server/Dockerfile.api
    container_name: config-api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../agent-bridge/backend/data:/app/backend/data
    networks:
      - project-net

  # ── Unified client (config dashboard + voice bot console) ─────────────────
  # Replaces the two previously-separate frontends (voice-frontend on 5173,
  # agent-dashboard on 5174) with a single React app that talks to both
  # backends — see client/nginx.conf for the /api and /integrations routing.
  # Kept on port 5173 so existing OAuth provider redirect URIs (Discord,
  # Zoom, Google Meet, Teams) continue to work unchanged.
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - config-api
      - voice-bot
    networks:
      - project-net

volumes:
  kafka-data:
  redis-data:
  mongo-data:

networks:
  project-net:
    driver: bridge
