version: "3.9"

services:
  agent-bot:
    build:
      context: .
      dockerfile: backend/server/Dockerfile.bot
    container_name: agent-bridge-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend/data:/app/backend/data:ro
    depends_on:
      - redis
    networks:
      - bridge-net

  config-api:
    build:
      context: .
      dockerfile: backend/server/Dockerfile.api
    container_name: agent-bridge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - bridge-net

  redis:
    image: redis:7-alpine
    container_name: agent-bridge-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - bridge-net

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: agent-bridge-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - bridge-net

  kafka:
    image: bitnami/kafka:latest
    container_name: agent-bridge-kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - bridge-net

  scrum-master-backend:
    build:
      context: ../../scrum-master/scrum-master-ai/backend
      dockerfile: Dockerfile
    container_name: scrum-master-backend
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - PORT=3001
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - kafka
    ports:
      - "3001:3001"
    networks:
      - bridge-net

volumes:
  redis-data:

networks:
  bridge-net:
